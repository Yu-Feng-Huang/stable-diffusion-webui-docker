name: Build Images

on:
  push:
    branches:
      - master
    paths:
      - docker-compose.yml
      - services/AUTOMATIC1111/**
      - services/download/**
      - services/comfy/**

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      auto: ${{ steps.filter.outputs.auto }}
      download: ${{ steps.filter.outputs.download }}
      comfy: ${{ steps.filter.outputs.comfy }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auto:
              - 'services/AUTOMATIC1111/**'
            download:
              - 'services/download/**'
            comfy:
              - 'services/comfy/**'
            compose:
              - 'docker-compose.yml'

  auto:
    needs: changes
    if: needs.changes.outputs.auto == 'true' || needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./services/AUTOMATIC1111
          platforms: linux/amd64
          push: true
          tags: eugene1234566/stable-diffusion-webui:latest
          cache-from: type=gha,scope=auto
          cache-to: type=gha,mode=max,scope=auto

  download:
    needs: changes
    if: needs.changes.outputs.download == 'true' || needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./services/download
          platforms: linux/amd64
          push: true
          tags: eugene1234566/stable-diffusion-downloader:latest
          cache-from: type=gha,scope=download
          cache-to: type=gha,mode=max,scope=download

  comfy:
    needs: changes
    if: needs.changes.outputs.comfy == 'true' || needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./services/comfy
          platforms: linux/amd64
          push: true
          tags: eugene1234566/stable-diffusion-comfy:latest
          cache-from: type=gha,scope=comfy
          cache-to: type=gha,mode=max,scope=comfy
